<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="图床">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖼️</text></svg>">
<title>我的 GitHub 图床</title>
<style>
:root{
  --primary:#8b5cf6; --primary-dark:#7c3aed; --pink:#ec4899;
  --text:#1e1b4b; --muted:#6b7280; --border:#ede9fe;
  --shadow:0 4px 24px rgba(139,92,246,.08);
  --shadow-lg:0 16px 48px rgba(139,92,246,.18);
  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#faf5ff 0%,#fdf2f8 50%,#f0f9ff 100%);
  background-attachment:fixed;
  color:var(--text); min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}
.header{
  background:linear-gradient(135deg,#7c3aed 0%,#db2777 100%);
  color:#fff; padding:26px 28px; border-radius:0 0 24px 24px;
  display:flex; justify-content:space-between; align-items:center;
  flex-wrap:wrap; gap:12px;
  box-shadow:0 8px 32px rgba(124,58,237,.25);
  position:relative; overflow:hidden;
  padding-top:calc(26px + env(safe-area-inset-top));
}
.header::before{
  content:''; position:absolute; top:-80px; right:-60px;
  width:260px; height:260px; border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);
}
.header h1{font-size:1.35rem; font-weight:700; letter-spacing:.5px; position:relative}
.header .sub{font-size:.8rem; opacity:.85; margin-top:2px; font-weight:400}
.btn{
  border:none; border-radius:12px; padding:10px 20px; font-size:.9rem;
  cursor:pointer; transition:all .2s; font-weight:600; font-family:inherit;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-white{background:#fff; color:var(--primary-dark); box-shadow:0 4px 12px rgba(0,0,0,.1)}
.btn-grad{background:var(--grad); color:#fff; box-shadow:0 6px 18px rgba(139,92,246,.35)}
.btn-grad:hover{box-shadow:0 8px 24px rgba(139,92,246,.45)}
.btn-ghost{background:#f3f4f6; color:#4b5563}
.btn-danger{background:#fef2f2; color:#dc2626}
.btn-sm{padding:7px 14px; font-size:.8rem; border-radius:10px}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none}
.container{max-width:1150px; margin:0 auto; padding:24px 20px 60px}
.card{
  background:#fff; border-radius:20px; box-shadow:var(--shadow);
  padding:22px; margin-bottom:20px; border:1px solid rgba(139,92,246,.06);
}
.card h2{
  font-size:.95rem; margin-bottom:16px; color:var(--text);
  display:flex; align-items:center; gap:8px; font-weight:700; flex-wrap:wrap;
}
.card h2 .dot{width:8px; height:8px; border-radius:50%; background:var(--grad)}
.token-row{display:flex; gap:10px; flex-wrap:wrap}
.token-row input{
  flex:1; min-width:200px; padding:12px 16px; border:2px solid var(--border);
  border-radius:12px; font-size:.9rem; outline:none; transition:border .2s; font-family:inherit;
}
.token-row input:focus{border-color:var(--primary)}
.drop-zone{
  border:2px dashed #d8ccf5; border-radius:18px; padding:40px 20px;
  text-align:center; color:var(--muted); cursor:pointer;
  transition:all .25s; background:linear-gradient(180deg,#fdfbff,#fff);
  touch-action:manipulation;
}
.drop-zone:hover{border-color:var(--primary); background:#faf5ff}
.drop-zone.dragover{border-color:var(--pink); background:#fdf2f8; color:var(--pink); transform:scale(1.01)}
.drop-zone .icon{font-size:2rem; margin-bottom:8px; display:block}
.drop-zone p{font-size:.95rem; font-weight:600; color:var(--text)}
.drop-zone .hint{font-size:.78rem; margin-top:8px; color:#a8a3b8; font-weight:400}
.pending-list{display:flex; flex-direction:column; gap:10px; margin-top:16px}
.pending-item{
  display:flex; align-items:center; gap:14px; padding:12px;
  background:linear-gradient(135deg,#fdfbff,#fff); border:1px solid var(--border);
  border-radius:14px; transition:all .2s;
}
.pending-item:hover{border-color:#d8ccf5; box-shadow:0 4px 16px rgba(139,92,246,.08)}
.pending-thumb{
  width:60px; height:60px; border-radius:10px; overflow:hidden;
  background:#f3f0fa; flex-shrink:0; display:flex; align-items:center; justify-content:center;
}
.pending-thumb img{width:100%; height:100%; object-fit:cover}
.pending-meta{flex:1; min-width:0}
.pending-name{font-size:.88rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pending-size{font-size:.76rem; color:var(--muted); margin-top:3px}
.pending-badge{
  display:inline-block; font-size:.68rem; padding:2px 8px; border-radius:6px;
  background:#ede9fe; color:var(--primary-dark); margin-left:6px; font-weight:600;
}
.pending-actions{display:flex; gap:8px; flex-shrink:0}
.progress-wrap{height:8px; background:#f3f0fa; border-radius:4px; margin-top:16px; overflow:hidden; display:none}
.progress-bar{height:100%; width:0; background:var(--grad); border-radius:4px; transition:width .3s}
.filter-bar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.search-box { flex: 1; min-width: 200px; position: relative; }
.search-box input {
  width: 100%; padding: 10px 16px 10px 36px; border: 2px solid var(--border);
  border-radius: 12px; font-size: 0.9rem; outline: none; transition: border .2s; font-family: inherit;
}
.search-box input:focus { border-color: var(--primary); }
.search-box svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; fill: #a8a3b8;
}
.type-filters {
  display: flex; gap: 6px; background: #f3f0fa; padding: 4px; border-radius: 12px;
  overflow-x: auto; white-space: nowrap; max-width: 100%;
  -webkit-overflow-scrolling: touch;
}
.type-filters::-webkit-scrollbar { display: none; }
.filter-btn {
  border: none; background: transparent; padding: 8px 16px; border-radius: 9px;
  font-size: 0.85rem; font-weight: 600; color: var(--muted); cursor: pointer;
  transition: all 0.2s; text-transform: uppercase;
}
.filter-btn:hover { color: var(--primary); }
.filter-btn.active { background: #fff; color: var(--primary-dark); box-shadow: 0 2px 8px rgba(139,92,246,.15); }
.date-filter-row {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  background: #fdfbff; padding: 10px 16px; border-radius: 12px; border: 1px dashed #d8ccf5;
}
.date-label { font-size: 0.85rem; font-weight: 600; color: var(--primary-dark); }
.date-input {
  padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
  font-family: inherit; font-size: 0.9rem; color: var(--text); outline: none;
  background: #fff; cursor: pointer;
}
.date-input:focus { border-color: var(--primary); }
.gallery-wrapper { display: flex; flex-direction: column; gap: 16px; }
.date-group {
  background: #fff; border-radius: 16px; box-shadow: var(--shadow);
  border: 1px solid rgba(139,92,246,.06); overflow: hidden; transition: all 0.3s;
}
.date-group summary {
  padding: 16px 20px; font-weight: 700; font-size: 0.95rem; color: var(--primary-dark);
  cursor: pointer; display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(to right, #faf5ff, #fff); user-select: none; list-style: none;
}
.date-group summary::-webkit-details-marker { display: none; }
.date-group summary::after {
  content: '❯'; color: var(--primary); font-size: 0.9rem; transition: transform 0.3s;
}
.date-group[open] summary::after { transform: rotate(90deg); }
.date-group[open] summary { border-bottom: 1px solid var(--border); }
.date-group .gallery { padding: 18px; }
.gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:18px}
.item-card{
  background:#fff; border-radius:18px; overflow:hidden; display:flex; flex-direction:column;
  box-shadow:var(--shadow); border:1px solid rgba(139,92,246,.06); transition:all .25s;
}
.item-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg)}
.item-preview{
  width:100%; height:170px; background:linear-gradient(135deg,#faf5ff,#fdf2f8);
  display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;
}
.item-preview img{max-width:100%; max-height:100%; object-fit:contain; cursor:pointer; transition:transform .3s}
.item-preview img:hover{transform:scale(1.04)}
.item-preview audio{width:90%}
.crop-hint{
  position:absolute; top:10px; right:10px; background:rgba(139,92,246,.9); color:#fff;
  font-size:.68rem; padding:4px 10px; border-radius:8px; opacity:0; transition:opacity .2s;
  pointer-events:none; backdrop-filter:blur(4px);
}
.item-preview:hover .crop-hint{opacity:1}
.item-body{padding:14px; display:flex; flex-direction:column; gap:10px}
.item-title-row { display: flex; flex-direction: column; gap: 2px; }
.item-name{
  font-size:.8rem; color:var(--text); font-weight:600;
  overflow:hidden; display:flex; align-items:center; gap:4px;
  cursor:pointer; transition:color .2s; user-select:none;
}
.item-name .name-text{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0;}
.item-name .edit-icon{font-size:.7rem; opacity:.35; transition:opacity .2s; flex-shrink:0;}
.item-name:hover{color:var(--primary);}
.item-name:hover .edit-icon{opacity:1;}
.item-time{font-size:.7rem; color:#a8a3b8; font-family:monospace;}
.link-row{display:flex; gap:6px}
.link-row input{
  flex:1; min-width:0; padding:8px 10px; border:1px solid var(--border);
  border-radius:9px; font-size:.72rem; color:#555; outline:none; font-family:inherit;
}
.action-row{display:flex; gap:6px; flex-wrap:wrap}
.toast{
  position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(20px);
  background:#1e1b4b; color:#fff; padding:14px 26px; border-radius:14px;
  font-size:.9rem; opacity:0; pointer-events:none; transition:all .3s; z-index:99999;
  max-width:90vw; box-shadow:0 12px 32px rgba(0,0,0,.25); font-weight:500;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.toast.error{background:#dc2626}
.toast.success{background:#10b981}
.empty-tip{text-align:center; color:#c4bdd6; padding:50px 0; font-size:.9rem}
.empty-tip .big{font-size:2.4rem; display:block; margin-bottom:10px}
.rename-modal{
  position:fixed; inset:0; background:rgba(15,10,35,.65); z-index:10000;
  display:none; align-items:center; justify-content:center; padding:20px;
  backdrop-filter:blur(6px);
}
.rename-modal.show{display:flex;}
.rename-dialog{
  background:#fff; border-radius:20px; padding:24px; width:100%; max-width:440px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  animation:modalIn .25s ease;
}
@keyframes modalIn{
  from{opacity:0; transform:scale(.95) translateY(10px);}
  to{opacity:1; transform:scale(1) translateY(0);}
}
.rename-dialog h3{
  font-size:1.05rem; margin-bottom:16px; color:var(--text);
  display:flex; align-items:center; gap:8px; font-weight:700;
}
.rename-dialog input{
  width:100%; padding:12px 16px; border:2px solid var(--border); border-radius:12px;
  font-size:.95rem; outline:none; font-family:inherit; transition:border .2s;
}
.rename-dialog input:focus{border-color:var(--primary);}
.rename-hint{font-size:.75rem; color:var(--muted); margin-top:10px; line-height:1.5;}
.rename-status{
  font-size:.8rem; color:var(--primary-dark); margin-top:10px; padding:8px 12px;
  background:#faf5ff; border-radius:8px; border-left:3px solid var(--primary);
  min-height:0; display:none; line-height:1.5;
}
.rename-status.show{display:block;}
.rename-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
.crop-modal{
  position:fixed; inset:0; background:rgba(15,10,35,.94); z-index:9999;
  display:none; flex-direction:column; backdrop-filter:blur(8px);
}
.crop-modal.show{display:flex}
.crop-header{
  display:flex; justify-content:space-between; align-items:center;
  padding:16px 24px; color:#fff; border-bottom:1px solid rgba(255,255,255,.08);
  padding-top:calc(16px + env(safe-area-inset-top));
}
.crop-header h3{font-size:1rem; font-weight:700}
.crop-close{
  background:rgba(255,255,255,.1); border:none; color:#fff; width:40px; height:40px;
  border-radius:10px; cursor:pointer; font-size:1.1rem; transition:background .2s;
}
.crop-close:hover{background:rgba(255,255,255,.2)}
.crop-stage{
  flex:1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;
  touch-action:none;
}
#cropCanvas{position:absolute; top:0; left:0; pointer-events:none}
.crop-box{
  position:absolute; border:2px solid #fff; cursor:move; touch-action:none;
  box-shadow:0 0 0 9999px rgba(0,0,0,.55);
  background-image:
    linear-gradient(to right,transparent calc(33.33% - .5px),rgba(255,255,255,.35) 33.33%,rgba(255,255,255,.35) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.35) 66.66%,rgba(255,255,255,.35) calc(66.66% + .5px),transparent calc(66.66% + .5px)),
    linear-gradient(to bottom,transparent calc(33.33% - .5px),rgba(255,255,255,.35) 33.33%,rgba(255,255,255,.35) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.35) 66.66%,rgba(255,255,255,.35) calc(66.66% + .5px),transparent calc(66.66% + .5px));
}
.crop-handle{
  position:absolute; width:18px; height:18px; background:#fff;
  border-radius:5px; border:2px solid var(--primary); box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.crop-handle[data-handle="nw"]{top:-9px; left:-9px; cursor:nwse-resize}
.crop-handle[data-handle="ne"]{top:-9px; right:-9px; cursor:nesw-resize}
.crop-handle[data-handle="sw"]{bottom:-9px; left:-9px; cursor:nesw-resize}
.crop-handle[data-handle="se"]{bottom:-9px; right:-9px; cursor:nwse-resize}
.crop-toolbar{
  background:rgba(255,255,255,.06); border-top:1px solid rgba(255,255,255,.08);
  padding:16px 24px; display:flex; flex-direction:column; gap:14px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
}
.crop-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.crop-row .label{color:rgba(255,255,255,.6); font-size:.8rem; font-weight:600; min-width:36px}
.ratio-group{display:flex; gap:6px; flex-wrap:wrap}
.ratio-btn{
  background:rgba(255,255,255,.1); border:none; color:rgba(255,255,255,.8);
  padding:8px 14px; border-radius:9px; font-size:.8rem; cursor:pointer;
  transition:all .2s; font-weight:600; font-family:inherit; min-height:38px;
}
.ratio-btn:hover{background:rgba(255,255,255,.2)}
.ratio-btn.active{background:var(--grad); color:#fff; box-shadow:0 4px 14px rgba(236,72,153,.4)}
.zoom-slider{flex:1; min-width:140px; accent-color:var(--pink); height:6px}
.crop-actions{display:flex; justify-content:flex-end; gap:10px}
@media (max-width:768px){
  .container{padding:16px 12px 40px}
  .card{padding:16px; border-radius:16px}
  .header{padding:18px 18px; padding-top:calc(18px + env(safe-area-inset-top)); border-radius:0 0 18px 18px}
  .header h1{font-size:1.15rem}
  .header .sub{font-size:.72rem}
  .btn{min-height:44px; padding:10px 16px}
  .btn-sm{min-height:38px; padding:8px 12px}
  .token-row{flex-direction:column}
  .token-row input{min-width:0; font-size:16px; width:100%}
  .token-row .btn{width:100%}
  .drop-zone{padding:28px 14px}
  .drop-zone p{font-size:.9rem}
  .drop-zone .hint{font-size:.72rem; line-height:1.5}
  .gallery{grid-template-columns:1fr; gap:14px}
  .item-preview{height:200px}
  .link-row input{font-size:14px}
  .pending-item{flex-wrap:wrap; gap:10px}
  .pending-actions{width:100%; justify-content:flex-end}
  .pending-actions .btn{flex:1}
  #uploadBar .btn{flex:1}
  .toast{bottom:calc(24px + env(safe-area-inset-bottom)); padding:12px 20px; font-size:.85rem}
  .crop-toolbar{padding:12px 14px; padding-bottom:calc(12px + env(safe-area-inset-bottom)); max-height:52vh; overflow-y:auto}
  .crop-header{padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top))}
  .crop-handle{width:24px; height:24px; border-radius:6px}
  .crop-handle[data-handle="nw"]{top:-12px; left:-12px}
  .crop-handle[data-handle="ne"]{top:-12px; right:-12px}
  .crop-handle[data-handle="sw"]{bottom:-12px; left:-12px}
  .crop-handle[data-handle="se"]{bottom:-12px; right:-12px}
  .crop-row .label{min-width:32px; font-size:.75rem}
  .ratio-btn{padding:8px 12px; font-size:.75rem}
  .crop-actions .btn{flex:1}
  .desktop-only{display:none}
  .date-group summary{padding: 14px 16px;}
  .date-group .gallery{padding: 12px;}
  .filter-bar { flex-direction: column; }
  .search-box { width: 100%; }
  .search-box input { font-size:16px; }
  .date-filter-row { flex-wrap: wrap; }
  .date-input { flex: 1; font-size:16px; width: 100%; }
  #clearDateBtn { width: 100%; }
  .gallery-head{flex-direction:column !important; align-items:stretch !important;}
  .gallery-head .type-filters{width:100%;}
  .rename-dialog{padding:20px;}
}
@media (max-width:380px){
  .header h1{font-size:1rem}
  .card{padding:14px}
  .pending-thumb{width:50px; height:50px}
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🖼️ 我的 GitHub 图床</h1>
    <div class="sub">多图上传 · 在线裁剪 · 智能搜索</div>
  </div>
  <button class="btn btn-white" id="refreshBtn">刷新图库</button>
</div>

<div class="container">

  <div class="card">
    <h2><span class="dot"></span>GitHub Token 设置</h2>
    <div class="token-row">
      <input type="password" id="tokenInput" placeholder="粘贴你的 GitHub Token（ghp_ 开头）"
             autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn btn-ghost btn-sm" id="pasteTokenBtn">粘贴</button>
      <button class="btn btn-grad" id="saveTokenBtn">保存 Token</button>
      <button class="btn btn-ghost btn-sm" id="clearTokenBtn">清除</button>
    </div>
  </div>

  <div class="card">
    <h2><span class="dot"></span>上传文件</h2>
    <div class="drop-zone" id="dropZone">
      <span class="icon">☁️</span>
      <p>点击选择文件<span class="desktop-only">，或拖拽到这里</span></p>
      <div class="hint">支持 jpg / png / gif / webp / svg / bmp / ico / mp3 / wav / m4a / ogg / flac / aac · 可多选</div>
    </div>
    <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.gif,.webp,.svg,.bmp,.ico,.mp3,.wav,.m4a,.ogg,.flac,.aac" style="display:none">

    <div class="pending-list" id="pendingList"></div>

    <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>

    <div id="uploadBar" style="display:none; margin-top:16px; display:flex; gap:10px; justify-content:flex-end;">
      <button class="btn btn-ghost" id="clearPendingBtn">清空列表</button>
      <button class="btn btn-grad" id="uploadAllBtn">开始上传</button>
    </div>
  </div>

  <div class="card">
    <div class="gallery-head" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
      <h2 style="margin-bottom:0;"><span class="dot"></span>图库 <span style="font-weight:400;color:#a8a3b8;font-size:.8rem;" id="galleryCount"></span></h2>

      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" id="fillDatesBtn" style="display:none;">⏱️ 补全历史时间</button>
        <div class="type-filters" id="typeFilters">
          <button class="filter-btn active" data-type="all">全部</button>
        </div>
      </div>
    </div>

    <div class="filter-bar">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>

<script>
const CONFIG = {
  username: '99434',
  repo: 'xing',
  branch: 'main'
};

const API_BASE    = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/`;
const API_COMMITS = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/commits`;
const API_GIT     = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/git`;
const API_REPO    = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}`;
const TOKEN_KEY   = 'github_imghost_token';
const RAW_BASE    = `https://cdn.jsdelivr.net/gh/${CONFIG.username}/${CONFIG.repo}@${CONFIG.branch}/`;
const DATES_FILE  = '_dates.json';

const $ = id => document.getElementById(id);

function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }

let toastTimer;
function toast(msg, type = '', duration = 2600) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = 'toast', duration);
}

function getHeaders() {
  const t = getToken();
  if (!t) throw new Error('请先设置 GitHub Token');
  return {
    'Authorization': `token ${t}`,
    'Accept': 'application/vnd.github.v3+json',
    'Content-Type': 'application/json'
  };
}

const isImage = n => /\.(jpg|jpeg|png|gif|webp|svg|bmp|ico)$/i.test(n);
const isAudio = n => /\.(mp3|wav|m4a|ogg|flac|aac)$/i.test(n);

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(2) + ' MB';
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try {
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy failed'));
    } catch (e) {
      document.body.removeChild(ta); reject(e);
    }
  });
}

function encodeBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = ''; const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}
function decodeBase64(b64) {
  const clean = b64.replace(/\s/g, '');
  const binary = atob(clean);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ==================== 全局状态 ==================== */
let pendingFiles = [];
let existingNames = new Set();
let uid = 0;
let allFilesData = [];
let globalFileDates = {};
let currentFilterType = 'all';
let currentSearchKeyword = '';
let currentFilterDate = '';

/* ==================== _dates.json ==================== */
async function loadDatesJson() {
  try {
    const res = await fetch(API_BASE + DATES_FILE + `?ref=${CONFIG.branch}&t=${Date.now()}`, { headers: getHeaders() });
    if (!res.ok) return { data: {}, sha: null };
    const json = await res.json();
    const content = decodeBase64(json.content);
    return { data: JSON.parse(content), sha: json.sha };
  } catch (e) {
    return { data: {}, sha: null };
  }
}
async function saveDatesJson(data, sha) {
  const content = encodeBase64(JSON.stringify(data, null, 2));
  const body = { message: `update _dates.json (${new Date().toISOString()})`, content, branch: CONFIG.branch };
  if (sha) body.sha = sha;
  const res = await fetch(API_BASE + DATES_FILE, {
    method: 'PUT', headers: getHeaders(), body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || '保存时间记录失败');
  }
}
async function recordFileDate(name, dateStr) {
  try {
    const { data, sha } = await loadDatesJson();
    data[name] = dateStr;
    await saveDatesJson(data, sha);
    globalFileDates[name] = dateStr;
  } catch (e) { console.error('记录时间失败', e); }
}
async function deleteFileDate(name) {
  try {
    const { data, sha } = await loadDatesJson();
    if (data[name]) {
      delete data[name];
      await saveDatesJson(data, sha);
    }
    delete globalFileDates[name];
  } catch (e) { console.error('删除时间记录失败', e); }
}

/* ==================== Token ==================== */
$('saveTokenBtn').onclick = () => {
  const t = $('tokenInput').value.trim();
  if (!t) return toast('请先粘贴 Token', 'error');
  localStorage.setItem(TOKEN_KEY, t);
  toast('Token 已保存 ✓', 'success');
  loadGallery();
};
$('clearTokenBtn').onclick = () => {
  localStorage.removeItem(TOKEN_KEY);
  $('tokenInput').value = '';
  toast('Token 已清除');
};
$('pasteTokenBtn').onclick = async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (!text || !text.trim()) return toast('剪贴板是空的', 'error');
    $('tokenInput').value = text.trim();
    toast('已粘贴，点「保存 Token」生效', 'success');
  } catch (e) {
    toast('无法读取剪贴板，请长按输入框手动粘贴', 'error');
  }
};

/* ==================== 文件选择 ==================== */
const dropZone = $('dropZone');
const fileInput = $('fileInput');

dropZone.onclick = () => fileInput.click();
fileInput.onchange = () => {
  addFiles(Array.from(fileInput.files));
  fileInput.value = '';
};
dropZone.addEventListener('dragover', e => {
  e.preventDefault(); dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const files = Array.from(e.dataTransfer.files).filter(f => isImage(f.name) || isAudio(f.name));
  if (files.length) addFiles(files);
  else toast('只支持图片和音频文件', 'error');
});

function addFiles(files) {
  const valid = files.filter(f => isImage(f.name) || isAudio(f.name));
  if (!valid.length) return toast('没有可用的图片或音频文件', 'error');
  valid.forEach(f => {
    pendingFiles.push({ id: ++uid, file: f, previewUrl: URL.createObjectURL(f), cropped: false });
  });
  renderPending();
  toast(`已添加 ${valid.length} 个文件`, 'success');
}

function renderPending() {
  const list = $('pendingList');
  const bar  = $('uploadBar');
  if (!pendingFiles.length) {
    list.innerHTML = ''; bar.style.display = 'none'; return;
  }
  bar.style.display = 'flex';
  $('uploadAllBtn').textContent = `开始上传（${pendingFiles.length}）`;

  list.innerHTML = pendingFiles.map(item => {
    const isImg = isImage(item.file.name);
    return `
      <div class="pending-item" data-id="${item.id}">
        <div class="pending-thumb">
          ${isImg ? `<img src="${item.previewUrl}" alt="">` : `<span style="font-size:1.4rem">🎵</span>`}
        </div>
        <div class="pending-meta">
          <div class="pending-name">${escapeHtml(item.file.name)}
            ${item.cropped ? '<span class="pending-badge">已裁剪</span>' : ''}
          </div>
          <div class="pending-size">${fmtSize(item.file.size)}</div>
        </div>
        <div class="pending-actions">
          ${isImg ? `<button class="btn btn-ghost btn-sm" data-act="crop">✂️ 裁剪</button>` : ''}
          <button class="btn btn-danger btn-sm" data-act="remove">移除</button>
        </div>
      </div>`;
  }).join('');

  list.querySelectorAll('.pending-item').forEach(el => {
    const id = +el.dataset.id;
    const item = pendingFiles.find(p => p.id === id);
    const cropBtn = el.querySelector('[data-act="crop"]');
    if (cropBtn) cropBtn.onclick = () => cropPending(item);
    el.querySelector('[data-act="remove"]').onclick = () => {
      URL.revokeObjectURL(item.previewUrl);
      pendingFiles = pendingFiles.filter(p => p.id !== id);
      renderPending();
    };
  });
}

$('clearPendingBtn').onclick = () => {
  pendingFiles.forEach(p => URL.revokeObjectURL(p.previewUrl));
  pendingFiles = [];
  renderPending();
};

/* ==================== 裁剪器 ==================== */
const crop = {
  img: null, imgX: 0, imgY: 0, scale: 1, baseScale: 1,
  stageW: 0, stageH: 0, box: { x: 0, y: 0, w: 0, h: 0 },
  ratio: null, onConfirm: null, outName: ''
};
const cropModal = $('cropModal'), cropStage = $('cropStage');
const cropCanvas = $('cropCanvas'), cropBoxEl = $('cropBox');
const cropCtx = cropCanvas.getContext('2d');

function openCropper(source, opts) {
  crop.outName = opts.fileName; crop.onConfirm = opts.onConfirm;
  crop.ratio = null;
  document.querySelectorAll('.ratio-btn').forEach(b => b.classList.toggle('active', b.dataset.ratio === 'free'));
  $('cropZoom').value = 100;
  cropModal.classList.add('show');
  document.body.style.overflow = 'hidden';

  const img = new Image();
  img.crossOrigin = 'anonymous';
  const isFile = source instanceof File || source instanceof Blob;
  const url = isFile ? URL.createObjectURL(source) : source;

  img.onload = () => {
    requestAnimationFrame(() => {
      setupCrop(img);
      if (isFile) URL.revokeObjectURL(url);
    });
  };
  img.onerror = () => {
    toast('图片加载失败（可能是跨域限制）', 'error');
    closeCropper();
    if (isFile) URL.revokeObjectURL(url);
  };
  img.src = url;
}

function closeCropper() {
  cropModal.classList.remove('show');
  document.body.style.overflow = '';
  crop.img = null; crop.onConfirm = null;
}
$('cropClose').onclick = closeCropper;
$('cropCancel').onclick = closeCropper;

function setupCrop(img) {
  crop.img = img;
  const rect = cropStage.getBoundingClientRect();
  crop.stageW = rect.width; crop.stageH = rect.height;
  const dpr = window.devicePixelRatio || 1;
  cropCanvas.width  = crop.stageW * dpr;
  cropCanvas.height = crop.stageH * dpr;
  cropCanvas.style.width  = crop.stageW + 'px';
  cropCanvas.style.height = crop.stageH + 'px';
  cropCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const fit = Math.min(crop.stageW / img.width, crop.stageH / img.height) * 0.9;
  crop.baseScale = fit; crop.scale = fit;
  crop.imgX = (crop.stageW - img.width * fit) / 2;
  crop.imgY = (crop.stageH - img.height * fit) / 2;
  const dw = img.width * fit, dh = img.height * fit;
  const bw = dw * 0.7, bh = dh * 0.7;
  crop.box = { x: crop.imgX + (dw - bw) / 2, y: crop.imgY + (dh - bh) / 2, w: bw, h: bh };
  drawCanvas(); syncBoxEl();
}
function drawCanvas() {
  const { img, imgX, imgY, scale, stageW, stageH } = crop;
  if (!img) return;
  cropCtx.clearRect(0, 0, stageW, stageH);
  cropCtx.drawImage(img, imgX, imgY, img.width * scale, img.height * scale);
}
function syncBoxEl() {
  const b = crop.box;
  cropBoxEl.style.left = b.x + 'px'; cropBoxEl.style.top = b.y + 'px';
  cropBoxEl.style.width = b.w + 'px'; cropBoxEl.style.height = b.h + 'px';
}
function visibleBounds() {
  const { img, imgX, imgY, scale, stageW, stageH } = crop;
  return {
    minX: Math.max(0, imgX), minY: Math.max(0, imgY),
    maxX: Math.min(stageW, imgX + img.width * scale),
    maxY: Math.min(stageH, imgY + img.height * scale)
  };
}
function clampBox() {
  const b = crop.box, vb = visibleBounds(), minW = 40, minH = 40;
  b.w = Math.max(minW, Math.min(b.w, vb.maxX - vb.minX));
  b.h = Math.max(minH, Math.min(b.h, vb.maxY - vb.minY));
  b.x = Math.max(vb.minX, Math.min(b.x, vb.maxX - b.w));
  b.y = Math.max(vb.minY, Math.min(b.y, vb.maxY - b.h));
}
let drag = null;
cropBoxEl.addEventListener('pointerdown', e => {
  const handle = e.target.dataset.handle;
  drag = { mode: handle ? 'resize' : 'move', handle: handle || '', startX: e.clientX, startY: e.clientY, box: { ...crop.box } };
  e.preventDefault(); e.stopPropagation();
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
  if (drag.mode === 'move') { crop.box.x = drag.box.x + dx; crop.box.y = drag.box.y + dy; clampBox(); }
  else { resizeBox(drag.handle, dx, dy, drag.box); }
  syncBoxEl(); drawCanvas();
});
window.addEventListener('pointerup', () => { drag = null; });
window.addEventListener('pointercancel', () => { drag = null; });

function resizeBox(handle, dx, dy, start) {
  let { x, y, w, h } = start; const minSize = 40;
  if (handle.includes('e')) w = start.w + dx;
  if (handle.includes('w')) w = start.w - dx;
  if (handle.includes('s')) h = start.h + dy;
  if (handle.includes('n')) h = start.h - dy;
  if (w < minSize) w = minSize; if (h < minSize) h = minSize;
  if (crop.ratio) {
    const r = crop.ratio, isCorner = handle.length === 2;
    if (isCorner) { h = w / r; if (h < minSize) { h = minSize; w = h * r; } }
    else if (handle === 'n' || handle === 's') { w = h * r; }
    else { h = w / r; }
  }
  if (handle.includes('w')) x = start.x + start.w - w;
  if (handle.includes('n')) y = start.y + start.h - h;
  crop.box = { x, y, w, h }; clampBox();
}

$('ratioGroup').addEventListener('click', e => {
  const btn = e.target.closest('.ratio-btn'); if (!btn) return;
  document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const r = btn.dataset.ratio; crop.ratio = r === 'free' ? null : parseFloat(r);
  if (crop.ratio) {
    const b = crop.box, cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    let w = b.w, h = w / crop.ratio;
    if (h > b.h) { h = b.h; w = h * crop.ratio; }
    crop.box = { x: cx - w / 2, y: cy - h / 2, w, h };
    clampBox(); syncBoxEl(); drawCanvas();
  }
});

$('cropZoom').oninput = e => {
  if (!crop.img) return;
  const newScale = crop.baseScale * (parseInt(e.target.value) / 100);
  const cx = crop.box.x + crop.box.w / 2, cy = crop.box.y + crop.box.h / 2;
  const ix = (cx - crop.imgX) / crop.scale, iy = (cy - crop.imgY) / crop.scale;
  crop.imgX = cx - ix * newScale; crop.imgY = cy - iy * newScale;
  crop.scale = newScale; clampBox(); syncBoxEl(); drawCanvas();
};

$('cropReset').onclick = () => {
  if (!crop.img) return;
  $('cropZoom').value = 100; crop.ratio = null;
  document.querySelectorAll('.ratio-btn').forEach(b => b.classList.toggle('active', b.dataset.ratio === 'free'));
  const img = crop.img, fit = crop.baseScale;
  crop.scale = fit;
  crop.imgX = (crop.stageW - img.width * fit) / 2;
  crop.imgY = (crop.stageH - img.height * fit) / 2;
  const dw = img.width * fit, dh = img.height * fit;
  crop.box = { x: crop.imgX + dw * 0.15, y: crop.imgY + dh * 0.15, w: dw * 0.7, h: dh * 0.7 };
  clampBox(); syncBoxEl(); drawCanvas();
};

$('cropConfirm').onclick = () => {
  if (!crop.img) return;
  const { img, imgX, imgY, scale, box } = crop;
  let sx = (box.x - imgX) / scale, sy = (box.y - imgY) / scale;
  let sw = box.w / scale, sh = box.h / scale;
  sx = Math.max(0, Math.min(img.width - 1, sx)); sy = Math.max(0, Math.min(img.height - 1, sy));
  sw = Math.min(img.width - sx, sw); sh = Math.min(img.height - sy, sh);
  const out = document.createElement('canvas');
  out.width  = Math.max(1, Math.round(sw)); out.height = Math.max(1, Math.round(sh));
  out.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, out.width, out.height);
  const name = crop.outName;
  const ext = (name.match(/\.\w+$/) || ['.png'])[0].toLowerCase();
  const keepPng = ['.png', '.svg', '.gif', '.bmp', '.ico'].includes(ext);
  const mime = keepPng ? 'image/png' : 'image/jpeg';
  out.toBlob(blob => {
    if (!blob) return toast('裁剪失败', 'error');
    const newExt = keepPng ? '.png' : '.jpg';
    const base = name.replace(/\.\w+$/, '').replace(/_crop$/, '');
    const outName = `${base}_crop${newExt}`;
    if (crop.onConfirm) crop.onConfirm(blob, outName);
    closeCropper();
  }, mime, 0.92);
};

function cropPending(item) {
  openCropper(item.file, {
    fileName: item.file.name,
    onConfirm: (blob, outName) => {
      const newFile = new File([blob], outName, { type: blob.type });
      URL.revokeObjectURL(item.previewUrl);
      item.file = newFile; item.previewUrl = URL.createObjectURL(newFile); item.cropped = true;
      renderPending(); toast('裁剪完成，点击「开始上传」即可上传', 'success');
    }
  });
}

/* ==================== 上传 ==================== */
async function ensureUniqueName(name) {
  if (!existingNames.has(name)) return name;
  const ext = (name.match(/\.\w+$/) || [''])[0];
  const base = name.slice(0, name.length - ext.length);
  let i = 1; let candidate = `${base}_${i}${ext}`;
  while (existingNames.has(candidate)) { i++; candidate = `${base}_${i}${ext}`; }
  return candidate;
}

async function uploadOne(file) {
  const base64 = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej; r.readAsDataURL(file);
  });
  const finalName = await ensureUniqueName(file.name);
  const res = await fetch(API_BASE + encodeURIComponent(finalName), {
    method: 'PUT', headers: getHeaders(),
    body: JSON.stringify({ message: `upload: ${finalName}`, content: base64, branch: CONFIG.branch })
  });
  if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.message || `HTTP ${res.status}`); }
  existingNames.add(finalName);
  await recordFileDate(finalName, new Date().toISOString());
  return finalName;
}

$('uploadAllBtn').onclick = async () => {
  if (!getToken()) return toast('请先设置 GitHub Token', 'error');
  const items = [...pendingFiles];
  if (!items.length) return;
  const bar = $('progressBar'), wrap = $('progressWrap');
  wrap.style.display = 'block'; $('uploadAllBtn').disabled = true;
  let ok = 0, fail = 0;
  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    bar.style.width = Math.round((i / items.length) * 100) + '%';
    toast(`正在上传 ${item.file.name}（${i + 1}/${items.length}）…`);
    try { await uploadOne(item.file); ok++; }
    catch (e) { fail++; console.error('上传失败:', item.file.name, e); }
    URL.revokeObjectURL(item.previewUrl);
    pendingFiles = pendingFiles.filter(p => p.id !== item.id);
    renderPending();
  }
  bar.style.width = '100%';
  setTimeout(() => { wrap.style.display = 'none'; bar.style.width = '0'; }, 700);
  $('uploadAllBtn').disabled = false;
  if (fail === 0) toast(`全部 ${ok} 个文件上传成功 ✓`, 'success');
  else toast(`完成：成功 ${ok} 个，失败 ${fail} 个`, 'error');
  loadGallery();
};

/* ==================== 图库加载（并行优化版） ==================== */
async function loadGallery() {
  const gallery = $('gallery');
  const emptyTip = $('emptyTip');

  if (!getToken()) {
    gallery.innerHTML = ''; $('galleryCount').textContent = '';
    emptyTip.style.display = 'block';
    emptyTip.innerHTML = '<span class="big">🔑</span>请先在上方设置 GitHub Token';
    $('fillDatesBtn').style.display = 'none';
    return;
  }

  gallery.innerHTML = '<div style="padding:30px;color:#a8a3b8;text-align:center;">正在加载图库…</div>';
  emptyTip.style.display = 'none';

  try {
    // ⭐ 并行：拿文件列表 + 拿时间记录
    const [resContent, datesResult] = await Promise.all([
      fetch(API_BASE + `?ref=${CONFIG.branch}&t=${Date.now()}`, { headers: getHeaders() }),
      loadDatesJson()
    ]);
    if (!resContent.ok) throw new Error('获取文件列表失败');
    const dataContent = await resContent.json();

    allFilesData = (Array.isArray(dataContent) ? dataContent : []).filter(f =>
      f.type === 'file' && (isImage(f.name) || isAudio(f.name))
    );

    existingNames = new Set(allFilesData.map(f => f.name));
    $('galleryCount').textContent = allFilesData.length ? `共 ${allFilesData.length} 个文件` : '';

    if (!allFilesData.length) {
      gallery.innerHTML = '';
      emptyTip.style.display = 'block';
      emptyTip.innerHTML = '<span class="big">📭</span>暂无文件，上传后会显示在这里';
      $('fillDatesBtn').style.display = 'none';
      return;
    }

    globalFileDates = datesResult.data || {};

    const missing = allFilesData.filter(f => !globalFileDates[f.name]);
    if (missing.length > 0) {
      $('fillDatesBtn').style.display = 'inline-block';
      $('fillDatesBtn').textContent = `⏱️ 补全历史时间 (${missing.length})`;
    } else {
      $('fillDatesBtn').style.display = 'none';
    }

    updateTypeFilters();
    renderGalleryFiltered();

  } catch (e) {
    gallery.innerHTML = '';
    emptyTip.style.display = 'block';
    emptyTip.innerHTML = `<span class="big">⚠️</span>加载失败：${e.message}`;
    toast('加载图库失败：' + e.message, 'error');
  }
}

function updateTypeFilters() {
  const container = $('typeFilters');
  const exts = new Set();
  allFilesData.forEach(f => {
    const match = f.name.match(/\.([a-zA-Z0-9]+)$/);
    if (match) exts.add(match[1].toLowerCase());
  });
  const sortedExts = Array.from(exts).sort();
  let html = `<button class="filter-btn ${currentFilterType === 'all' ? 'active' : ''}" data-type="all">全部</button>`;
  sortedExts.forEach(ext => {
    html += `<button class="filter-btn ${currentFilterType === ext ? 'active' : ''}" data-type="${ext}">${ext}</button>`;
  });
  container.innerHTML = html;
  container.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentFilterType = e.target.dataset.type;
      $('searchInput').value = ''; currentSearchKeyword = '';
      $('dateFilter').value = ''; currentFilterDate = '';
      $('clearDateBtn').style.display = 'none';
      renderGalleryFiltered();
    });
  });
}

function renderGalleryFiltered() {
  const gallery = $('gallery');
  const emptyTip = $('emptyTip');

  let filteredFiles = allFilesData.filter(f => {
    const fileExt = (f.name.match(/\.([a-zA-Z0-9]+)$/) || ['', ''])[1].toLowerCase();
    const matchType = currentFilterType === 'all' || fileExt === currentFilterType;
    const matchKeyword = f.name.toLowerCase().includes(currentSearchKeyword.toLowerCase());
    const fileDate = globalFileDates[f.name] ? globalFileDates[f.name].split('T')[0] : '';
    const matchDate = currentFilterDate === '' || fileDate === currentFilterDate;
    return matchType && matchKeyword && matchDate;
  });

  if (!filteredFiles.length) {
    gallery.innerHTML = '';
    emptyTip.style.display = 'block';
    emptyTip.innerHTML = '<span class="big">🔍</span>没有找到符合条件的文件';
    return;
  }
  emptyTip.style.display = 'none';

  const groups = {};
  filteredFiles.forEach(f => {
    const fullDate = globalFileDates[f.name];
    const dateOnly = fullDate ? fullDate.split('T')[0] : '未知日期';
    if (!groups[dateOnly]) groups[dateOnly] = [];
    groups[dateOnly].push(f);
  });

  const sortedDates = Object.keys(groups).sort((a, b) => {
    if (a === '未知日期') return 1;
    if (b === '未知日期') return -1;
    return b.localeCompare(a);
  });

  let html = '';
  sortedDates.forEach((date, index) => {
    const isSearching = currentSearchKeyword !== '' || currentFilterType !== 'all' || currentFilterDate !== '';
    const isOpen = (index === 0 || isSearching || date === '未知日期') ? 'open' : '';
    const count = groups[date].length;
    let displayDate = date;
    if (date !== '未知日期') {
      const parts = date.split('-');
      displayDate = `${parts[0]}年${parts[1]}月${parts[2]}日`;
    }
    html += `
      <details class="date-group" ${isOpen}>
        <summary>
          <span>📅 ${displayDate}</span>
          <span style="font-size:0.8rem; font-weight:normal; color:#a8a3b8; margin-right:10px;">(${count}个)</span>
        </summary>
        <div class="gallery">
          ${groups[date].map(renderCard).join('')}
        </div>
      </details>`;
  });

  gallery.innerHTML = html;
  bindCards();
}

$('searchInput').addEventListener('input', (e) => {
  currentSearchKeyword = e.target.value.trim();
  renderGalleryFiltered();
});
$('dateFilter').addEventListener('change', (e) => {
  currentFilterDate = e.target.value;
  $('clearDateBtn').style.display = currentFilterDate ? 'inline-block' : 'none';
  renderGalleryFiltered();
});
$('clearDateBtn').onclick = () => {
  $('dateFilter').value = ''; currentFilterDate = '';
  $('clearDateBtn').style.display = 'none';
  renderGalleryFiltered();
};

function renderCard(file) {
  const name = file.name;
  const sha = file.sha;
  const url = RAW_BASE + encodeURIComponent(name);
  const img = isImage(name);
  const safeName = escapeAttr(name);
  const safeSha = escapeAttr(sha);
  const safeUrl = escapeAttr(url);

  const fullDate = globalFileDates[name];
  let timeDisplay = '未知时间';
  if (fullDate) {
    const d = new Date(fullDate);
    if (!isNaN(d.getTime())) {
      const pad = n => String(n).padStart(2, '0');
      timeDisplay = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
  }

  const preview = img
    ? `<div class="item-preview">
         <img src="${safeUrl}" alt="${safeName}" loading="lazy" onerror="this.style.display='none'">
         <div class="crop-hint">点击图片可裁剪</div>
       </div>`
    : `<div class="item-preview"><audio controls preload="none" src="${safeUrl}"></audio></div>`;

  return `
    <div class="item-card" data-name="${safeName}" data-sha="${safeSha}">
      ${preview}
      <div class="item-body">
        <div class="item-title-row">
          <div class="item-name" title="点击改名">
            <span class="name-text">${escapeHtml(name)}</span>
            <span class="edit-icon">✏️</span>
          </div>
          <div class="item-time">🕒 ${timeDisplay}</div>
        </div>
        <div class="link-row">
          <input type="text" readonly value="${safeUrl}" class="link-input">
          <button class="btn btn-ghost btn-sm copy-btn">复制</button>
        </div>
        <div class="action-row">
          <button class="btn btn-ghost btn-sm open-btn">打开</button>
          ${img ? '<button class="btn btn-ghost btn-sm crop-btn">✂️ 裁剪</button>' : ''}
          <button class="btn btn-danger btn-sm delete-btn">删除</button>
        </div>
      </div>
    </div>`;
}

function bindCards() {
  document.querySelectorAll('.item-card').forEach(card => {
    const name = card.dataset.name;
    const sha = card.dataset.sha;
    const linkInput = card.querySelector('.link-input');
    const url = linkInput.value;

    card.querySelector('.copy-btn').onclick = () => {
      copyText(url).then(() => toast('链接已复制 ✓', 'success'))
        .catch(() => { linkInput.select(); document.execCommand('copy'); toast('链接已复制 ✓', 'success'); });
    };
    card.querySelector('.open-btn').onclick = () => window.open(url, '_blank');
    const cropBtn = card.querySelector('.crop-btn');
    if (cropBtn) cropBtn.onclick = () => cropGalleryImage(name, url);
    const previewImg = card.querySelector('.item-preview img');
    if (previewImg) previewImg.onclick = () => cropGalleryImage(name, url);

    const nameEl = card.querySelector('.item-name');
    if (nameEl) nameEl.onclick = () => openRenameModal(name);

    card.querySelector('.delete-btn').onclick = async () => {
      if (!confirm(`确定删除「${name}」吗？`)) return;
      if (!getToken()) return toast('请先设置 Token', 'error');
      try {
        const infoRes = await fetch(API_BASE + encodeURIComponent(name) + `?ref=${CONFIG.branch}&t=${Date.now()}`, { headers: getHeaders() });
        let useSha = sha;
        if (infoRes.ok) { const info = await infoRes.json(); if (info.sha) useSha = info.sha; }

        const res = await fetch(API_BASE + encodeURIComponent(name), {
          method: 'DELETE', headers: getHeaders(),
          body: JSON.stringify({ message: `delete: ${name}`, sha: useSha, branch: CONFIG.branch })
        });
        if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.message || `HTTP ${res.status}`); }
        await deleteFileDate(name);
        toast(`「${name}」已删除`, 'success');
        loadGallery();
      } catch (e) { toast('删除失败：' + e.message, 'error'); }
    };
  });
}

function cropGalleryImage(name, url) {
  openCropper(url, {
    fileName: name,
    onConfirm: async (blob, outName) => {
      if (!getToken()) return toast('请先设置 Token', 'error');
      const file = new File([blob], outName, { type: blob.type });
      toast('正在上传裁剪后的图片…');
      try {
        const finalName = await uploadOne(file);
        toast(`已上传为「${finalName}」✓`, 'success');
        loadGallery();
      } catch (e) { toast('上传失败：' + e.message, 'error'); }
    }
  });
}

/* ==================== 改名（Git Data API 快速版） ==================== */
let renamingFile = null;

function setRenameStatus(text, show = true) {
  const el = $('renameStatus');
  el.textContent = text;
  el.classList.toggle('show', show);
}

function openRenameModal(name) {
  renamingFile = { name };
  const input = $('renameInput');
  input.value = name;
  input.disabled = false;
  $('renameConfirmBtn').disabled = false;
  $('renameCancelBtn').disabled = false;
  setRenameStatus('', false);
  $('renameModal').classList.add('show');
  document.body.style.overflow = 'hidden';
  setTimeout(() => {
    input.focus();
    const ext = (name.match(/\.\w+$/) || [''])[0];
    input.setSelectionRange(0, name.length - ext.length);
  }, 100);
}
function closeRenameModal() {
  $('renameModal').classList.remove('show');
  document.body.style.overflow = '';
  setRenameStatus('', false);
  renamingFile = null;
}
$('renameCancelBtn').onclick = closeRenameModal;

/**
 * ⭐ 核心：用 Git Data API 改名
 * 不传输文件内容，只改路径 → 手机也秒改
 */
async function renameViaGitData(oldName, newName, onStep) {
  const branch = CONFIG.branch;
  const headers = getHeaders();

  // ① 并行拿：文件最新 sha + 分支最新 commit + _dates.json 内容
  onStep('① 读取信息…');
  const [contentRes, refRes, datesResult] = await Promise.all([
    fetch(`${API_REPO}/contents/${encodeURIComponent(oldName)}?ref=${branch}&t=${Date.now()}`, { headers }),
    fetch(`${API_REPO}/git/ref/heads/${branch}?t=${Date.now()}`, { headers }),
    loadDatesJson()
  ]);
  if (!contentRes.ok) throw new Error(`读取文件失败 HTTP ${contentRes.status}（文件可能已被删）`);
  if (!refRes.ok) throw new Error(`读取分支失败 HTTP ${refRes.status}`);
  const contentInfo = await contentRes.json();
  const refInfo = await refRes.json();
  const blobSha = contentInfo.sha;
  const parentCommitSha = refInfo.object.sha;
  if (!blobSha || !parentCommitSha) throw new Error('未获取到关键 sha');

  // ② 拿 tree sha
  onStep('② 获取目录树…');
  const commitRes = await fetch(`${API_REPO}/git/commits/${parentCommitSha}?t=${Date.now()}`, { headers });
  if (!commitRes.ok) throw new Error(`读取提交失败 HTTP ${commitRes.status}`);
  const commitInfo = await commitRes.json();
  const baseTreeSha = commitInfo.tree.sha;

  // ③ 准备 _dates.json 新内容（时间迁移）
  onStep('③ 迁移时间记录…');
  const dates = datesResult.data || {};
  const oldTime = dates[oldName] || globalFileDates[oldName] || new Date().toISOString();
  const newDates = { ...dates };
  delete newDates[oldName];
  newDates[newName] = oldTime;

  let datesBlobSha = null;
  try {
    const blobRes = await fetch(`${API_REPO}/git/blobs`, {
      method: 'POST', headers,
      body: JSON.stringify({ content: JSON.stringify(newDates, null, 2), encoding: 'utf-8' })
    });
    if (blobRes.ok) { const b = await blobRes.json(); datesBlobSha = b.sha; }
  } catch (e) { console.warn('准备 _dates.json blob 失败', e); }

  // ④ 创建新 tree（删旧路径 + 加新路径 + 更新 _dates.json）
  onStep('④ 生成新目录…');
  const treeItems = [
    { path: oldName, mode: '100644', type: 'blob', sha: null },   // 删除旧路径
    { path: newName, mode: '100644', type: 'blob', sha: blobSha } // 新路径指向原 blob（内容不变！）
  ];
  if (datesBlobSha) {
    treeItems.push({ path: DATES_FILE, mode: '100644', type: 'blob', sha: datesBlobSha });
  }
  const treeRes = await fetch(`${API_REPO}/git/trees`, {
    method: 'POST', headers,
    body: JSON.stringify({ base_tree: baseTreeSha, tree: treeItems })
  });
  if (!treeRes.ok) {
    const e = await treeRes.json().catch(() => ({}));
    throw new Error(`创建 tree 失败 HTTP ${treeRes.status} ${e.message || ''}`);
  }
  const newTree = await treeRes.json();

  // ⑤ 创建新 commit
  onStep('⑤ 提交改名…');
  const commitCreateRes = await fetch(`${API_REPO}/git/commits`, {
    method: 'POST', headers,
    body: JSON.stringify({
      message: `rename: ${oldName} → ${newName}`,
      tree: newTree.sha,
      parents: [parentCommitSha]
    })
  });
  if (!commitCreateRes.ok) {
    const e = await commitCreateRes.json().catch(() => ({}));
    throw new Error(`创建 commit 失败 HTTP ${commitCreateRes.status} ${e.message || ''}`);
  }
  const newCommit = await commitCreateRes.json();

  // ⑥ 更新分支 ref
  onStep('⑥ 更新分支…');
  const updateRes = await fetch(`${API_REPO}/git/refs/heads/${branch}`, {
    method: 'PATCH', headers,
    body: JSON.stringify({ sha: newCommit.sha, force: false })
  });
  if (!updateRes.ok) {
    const e = await updateRes.json().catch(() => ({}));
    throw new Error(`更新分支失败 HTTP ${updateRes.status} ${e.message || ''}`);
  }

  // 更新本地缓存
  delete globalFileDates[oldName];
  globalFileDates[newName] = oldTime;

  return { newName };
}

$('renameConfirmBtn').onclick = async () => {
  if (!renamingFile) return;
  const oldName = renamingFile.name;
  const newName = $('renameInput').value.trim();

  if (!newName) return toast('请输入新文件名', 'error');
  if (newName === oldName) { closeRenameModal(); return; }
  if (existingNames.has(newName)) return toast('新名字已存在，请换一个', 'error');

  const oldExt = (oldName.match(/\.\w+$/) || [''])[0].toLowerCase();
  const newExt = (newName.match(/\.\w+$/) || [''])[0].toLowerCase();
  if (oldExt !== newExt) {
    if (!confirm(`⚠️ 后缀将从「${oldExt || '无'}」改为「${newExt || '无'}」，可能影响显示，确定继续？`)) return;
  }

  const btn = $('renameConfirmBtn');
  const cancelBtn = $('renameCancelBtn');
  btn.disabled = true;
  cancelBtn.disabled = true;
  $('renameInput').disabled = true;
  btn.textContent = '处理中…';

  try {
    await renameViaGitData(oldName, newName, (msg) => {
      setRenameStatus(msg);
      btn.textContent = msg.replace(/[①-⑨]\s*/, '').replace('…', '');
    });
    setRenameStatus('✅ 改名成功，正在刷新图库…');
    toast(`已重命名为「${newName}」✓`, 'success', 3000);
    closeRenameModal();
    await loadGallery();
  } catch (e) {
    console.error('重命名失败:', e);
    setRenameStatus('❌ 失败：' + e.message);
    toast('重命名失败：' + e.message, 'error', 5000);
    btn.disabled = false;
    cancelBtn.disabled = false;
    $('renameInput').disabled = false;
  } finally {
    btn.textContent = '确认改名';
  }
};

/* ==================== 补全历史时间 ==================== */
$('fillDatesBtn').onclick = async () => {
  if (!allFilesData.length) return;
  const missing = allFilesData.filter(f => !globalFileDates[f.name]).map(f => f.name);
  if (!missing.length) return toast('没有缺失的时间记录', 'success');

  const btn = $('fillDatesBtn');
  btn.disabled = true;
  const originalText = btn.textContent;

  try {
    const { data, sha } = await loadDatesJson();
    let ok = 0, fail = 0;

    for (let i = 0; i < missing.length; i++) {
      const name = missing[i];
      btn.textContent = `补全中… ${i + 1}/${missing.length}`;
      try {
        const res = await fetch(
          `${API_COMMITS}?path=${encodeURIComponent(name)}&sha=${CONFIG.branch}&per_page=1&t=${Date.now()}`,
          { headers: getHeaders() }
        );
        if (res.ok) {
          const arr = await res.json();
          if (arr.length > 0) { data[name] = arr[0].commit.author.date; ok++; }
          else fail++;
        } else fail++;
      } catch (e) { fail++; }
      if (i % 5 === 4) await new Promise(r => setTimeout(r, 500));
    }

    if (ok > 0) {
      await saveDatesJson(data, sha);
      toast(`补全完成：成功 ${ok} 个${fail ? `，失败 ${fail} 个` : ''}`, fail ? '' : 'success');
      await loadGallery();
    } else {
      toast(`补全失败：${fail} 个文件都没有找到提交记录`, 'error');
      btn.disabled = false;
      btn.textContent = originalText;
    }
  } catch (e) {
    toast('补全失败：' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = originalText;
  }
};

/* ==================== 刷新 ==================== */
$('refreshBtn').onclick = () => {
  $('searchInput').value = ''; currentSearchKeyword = '';
  currentFilterType = 'all';
  $('dateFilter').value = ''; currentFilterDate = '';
  $('clearDateBtn').style.display = 'none';
  loadGallery();
  toast('正在刷新…');
};

/* ==================== 初始化 ==================== */
(function init() {
  const saved = getToken();
  if (saved) $('tokenInput').value = saved;
  loadGallery();
  window.addEventListener('resize', () => {
    if (cropModal.classList.contains('show')) closeCropper();
  });
})();
</script>
